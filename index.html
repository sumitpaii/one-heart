<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09020b">
<title>20 Languages, One Heart ❤️</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+Thai:wght@400;700&family=Noto+Sans+Telugu:wght@400;700&family=Noto+Sans+Gurmukhi:wght@400;700&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #09020b; color: #ffe7f1; }
  body { font-family: system-ui, sans-serif; overflow: hidden; }
  main { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px 12px 24px; }
  h1 { font-size: clamp(1.15rem, 4vw, 1.8rem); margin: 0 0 5px; text-align: center; letter-spacing: .04em; font-weight: 600; }
  p { color: #d7a7bd; margin: 0 0 8px; font-size: .88rem; text-align: center; }
  canvas { display: block; width: min(96vw, 760px); height: min(74svh, 650px); max-height: 650px; }
  .bottom { display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; margin-top: 4px; }
  button { color: #ffe7f1; background: #28101f; border: 1px solid #a83b70; border-radius: 999px; padding: 10px 16px; font-size: .9rem; cursor: pointer; }
  button:hover { background:#40162f; }
  .note { font-size: .72rem; color:#98788a; margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1>20 Languages. One Heart. ❤️</h1>
  <p>Twenty languages, one heart — drawn just for you.</p>
  <canvas id="heart" aria-label="An animated heart made of love messages in 20 languages"></canvas>
  <div class="bottom">
    <button id="toggle">Pause animation</button>
    <button id="share">Share this page</button>
  </div>
  <div class="note">Made for you, love! • Turn your phone sideways for a wider heart</div>
</main>
<script>
const phrases = [
  ["I love you, D!", "Arial, sans-serif"],
  ["मैं तुमसे प्यार करता हूँ", "'Noto Sans Devanagari', sans-serif"],
  ["Je t’aime", "Arial, sans-serif"], ["Te amo", "Arial, sans-serif"],
  ["Anh yêu em", "Arial, sans-serif"], ["我爱你", "'Noto Sans JP', sans-serif"],
  ["愛してる", "'Noto Sans JP', sans-serif"], ["Я тебя люблю", "Arial, sans-serif"],
  ["사랑해", "'Noto Sans KR', sans-serif"], ["Ich liebe dich", "Arial, sans-serif"],
  ["Ti amo", "Arial, sans-serif"], ["Eu te amo", "Arial, sans-serif"],
  ["আমি তোমাকে ভালোবাসি", "'Noto Sans Bengali', sans-serif"],
  ["मी तुझ्यावर प्रेम करतो", "'Noto Sans Devanagari', sans-serif"],
  ["Seni seviyorum", "Arial, sans-serif"], ["Aku cinta kamu", "Arial, sans-serif"],
  ["ฉันรักคุณ", "'Noto Sans Thai', sans-serif"],
  ["నేను నిన్ను ప్రేమిస్తున్నాను", "'Noto Sans Telugu', sans-serif"],
  ["ਮੈਂ ਤੈਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹਾਂ", "'Noto Sans Gurmukhi', sans-serif"],
  ["Kocham cię", "Arial, sans-serif"]
];
const palette=["#ff8bb8","#ffb5d0","#ff4f91","#ffd0e1","#e86aa4","#ff9fbd"];
const canvas=document.getElementById("heart"),ctx=canvas.getContext("2d");
let W=800,H=650,dpr=1,raf=0,running=false,done=false,frame=0,layout;
const DRAW_FRAMES=210,FILL_FRAMES=430;
function hp(t){return{x:16*Math.sin(t)**3,y:13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)}}
function pathHeart(cx,cy,s){
 ctx.beginPath();
 for(let i=0;i<=480;i++){const p=hp(i/480*Math.PI*2),x=cx+p.x*s,y=cy-p.y*s;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
 ctx.closePath();
}
function setup(){
 const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=Math.max(300,r.width);H=Math.max(320,r.height);
 canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
 const s=Math.min(W/36.5,H/34)*.88,cx=W/2,cy=H/2+s*.12;
 const outline=[];
 for(let i=0;i<360;i++){const t=i/360*Math.PI*2,p=hp(t),q=hp(t+.01);outline.push({
  x:cx+p.x*s,y:cy-p.y*s,angle:Math.atan2(-(q.y-p.y),q.x-p.x),lang:Math.floor(i/360*phrases.length),
  color:palette[i%palette.length],glow:(i%47===5)||(i%71===19)
 })}
 // Pre-layout many short, readable multilingual text labels in rows.
 // The whole row is clipped to the exact heart path, guaranteeing the silhouette.
 const rows=[];
 const fontSize=Math.max(6.2,Math.min(8.4,W/80)), lineH=fontSize*1.85;
 let row=0;
 for(let y=-16.2;y<=16.2;y+=lineH/s,row++){
  let x=-16.1, guard=0, lang=(row*3)%phrases.length;
  const yy=cy-y*s;
  while(x<=16.1&&guard++<100){
   const item=phrases[lang%phrases.length];
   ctx.font=`700 ${fontSize}px ${item[1]}`;
   const width=ctx.measureText(item[0]).width;
   const xx=cx+x*s;
   rows.push({x:xx+width/2,y:yy,lang:lang%phrases.length,color:palette[(row+guard*2)%palette.length],
     glow:((row*31+guard*17)%41===3)||((row*19+guard*7)%67===8),size:fontSize});
   x+=(width+fontSize*1.7)/s;
   lang++;
  }
 }
 layout={s,cx,cy,outline,rows,fontSize};
 frame=0;done=false;running=true;
 drawFrame();
}
function text(item,size,alpha=1){
 const ph=phrases[item.lang];ctx.save();ctx.translate(item.x,item.y);
 if(item.angle)ctx.rotate(item.angle);
 ctx.font=`700 ${size||item.size||7}px ${ph[1]}`;ctx.textAlign="center";ctx.textBaseline="middle";
 ctx.fillStyle=item.color;ctx.globalAlpha=alpha;
 if(item.glow){ctx.shadowColor=item.color;ctx.shadowBlur=10}
 ctx.fillText(ph[0],0,0);ctx.restore();
}
function star(x,y,color,r=1.3){
 ctx.save();ctx.fillStyle="#fff5fb";ctx.shadowColor=color;ctx.shadowBlur=11;
 ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();
}
function drawFrame(){
 const {s,cx,cy,outline,rows,fontSize}=layout;
 ctx.clearRect(0,0,W,H);
 // Subtle aura under the finished heart.
 ctx.save();ctx.globalAlpha=.055;ctx.fillStyle="#ff247f";ctx.shadowColor="#ff247f";ctx.shadowBlur=42;
 pathHeart(cx,cy,s);ctx.fill();ctx.restore();
 const outlineP=Math.min(1,frame/DRAW_FRAMES);
 const fillP=Math.max(0,Math.min(1,(frame-DRAW_FRAMES)/FILL_FRAMES));
 // Phase 1: the multilingual outline is revealed in drawing order.
 const outN=Math.floor(outline.length*outlineP);
 for(let i=0;i<outN;i+=2){text(outline[i],Math.max(5.4,Math.min(7.2,W/94)),.98);if(outline[i].glow)star(outline[i].x,outline[i].y,palette[i%palette.length],1.1)}
 if(outlineP<1&&outN>0){const p=outline[Math.min(outN,outline.length-1)];star(p.x,p.y,"#ff8bb8",2.2)}
 // Phase 2: progressively reveal the text rows from the top down, clipped to the heart.
 if(fillP>0){
  ctx.save();pathHeart(cx,cy,s);ctx.clip();
  const revealY=(cy-17*s)+fillP*(34*s);
  ctx.beginPath();ctx.rect(0,cy-17*s,W,Math.max(0,revealY-(cy-17*s)));ctx.clip();
  for(let i=0;i<rows.length;i++){
   const item=rows[i];text(item,item.size,.88);
   // Star-like glow on a sparse, stable selection only.
   if(item.glow)star(item.x,item.y,item.color,1.05);
  }
  ctx.restore();
 }
 if(fillP>=1){
  ctx.save();ctx.font=`700 ${Math.max(12,Math.min(18,W/36))}px Arial,sans-serif`;
  ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle="#fff5fa";
  ctx.shadowColor="#ff69a8";ctx.shadowBlur=12;ctx.fillText("I love you, D!",cx,cy);ctx.restore();
  done=true;running=false;document.getElementById("toggle").textContent="Replay animation";
 }
}
function animate(){
 if(!running||done)return;
 frame++;drawFrame();
 if(done)return;
 raf=requestAnimationFrame(animate);
}
function begin(){
 if(raf)cancelAnimationFrame(raf);
 setup();frame=0;done=false;running=true;
 document.getElementById("toggle").textContent="Pause animation";
 animate();
}
window.addEventListener("resize",()=>begin());
document.getElementById("toggle").addEventListener("click",e=>{
 if(done){begin();return}
 running=!running;
 e.currentTarget.textContent=running?"Pause animation":"Resume animation";
 if(running)animate();else if(raf)cancelAnimationFrame(raf);
});
document.getElementById("share").addEventListener("click",async()=>{
 const data={title:document.title,text:"20 languages. One heart. ❤️",url:location.href};
 try{if(navigator.share)await navigator.share(data);else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);alert("Link copied!")}else prompt("Copy this link:",location.href)}catch(_){}
});
begin();
</script>
</body>
</html>
