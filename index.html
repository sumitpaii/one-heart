<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09020b">
<title>20 Languages, One Heart ❤️</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&family=Noto+Sans+Bengali:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+Thai:wght@400;700&family=Noto+Sans+Telugu:wght@400;700&family=Noto+Sans+Gurmukhi:wght@400;700&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #09020b; color: #ffe7f1; }
  body { font-family: system-ui, sans-serif; overflow: hidden; }
  main { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px 12px 24px; }
  h1 { font-size: clamp(1.15rem, 4vw, 1.8rem); margin: 0 0 5px; text-align: center; letter-spacing: .04em; font-weight: 600; }
  p { color: #d7a7bd; margin: 0 0 8px; font-size: .88rem; text-align: center; }
  canvas { display: block; width: min(96vw, 760px); height: min(74svh, 650px); max-height: 650px; }
  .bottom { display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; margin-top: 4px; }
  button { color: #ffe7f1; background: #28101f; border: 1px solid #a83b70; border-radius: 999px; padding: 10px 16px; font-size: .9rem; cursor: pointer; }
  button:hover { background:#40162f; }
  .note { font-size: .72rem; color:#98788a; margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1>20 Languages. One Heart. ❤️</h1>
  <p>Watch a heart draw itself, then fill with love in 20 languages.</p>
  <canvas id="heart" aria-label="An animated heart made of love messages in 20 languages"></canvas>
  <div class="bottom">
    <button id="toggle">Pause animation</button>
    <button id="share">Share this page</button>
  </div>
  <div class="note">Made with love • Turn your phone sideways for a wider heart</div>
</main>
<script>
const phrases = [
  ["I love you, Divya", "Arial, sans-serif"],
  ["मैं तुमसे प्यार करता हूँ", "'Noto Sans Devanagari', sans-serif"],
  ["Je t’aime", "Arial, sans-serif"],
  ["Te amo", "Arial, sans-serif"],
  ["Anh yêu em", "Arial, sans-serif"],
  ["我爱你", "'Noto Sans JP', sans-serif"],
  ["愛してる", "'Noto Sans JP', sans-serif"],
  ["Я тебя люблю", "Arial, sans-serif"],
  ["사랑해", "'Noto Sans KR', sans-serif"],
  ["Ich liebe dich", "Arial, sans-serif"],
  ["Ti amo", "Arial, sans-serif"],
  ["Eu te amo", "Arial, sans-serif"],
  ["আমি তোমাকে ভালোবাসি", "'Noto Sans Bengali', sans-serif"],
  ["मी तुझ्यावर प्रेम करतो", "'Noto Sans Devanagari', sans-serif"],
  ["Seni seviyorum", "Arial, sans-serif"],
  ["Aku cinta kamu", "Arial, sans-serif"],
  ["ฉันรักคุณ", "'Noto Sans Thai', sans-serif"],
  ["నేను నిన్ను ప్రేమిస్తున్నాను", "'Noto Sans Telugu', sans-serif"],
  ["ਮੈਂ ਤੈਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹਾਂ", "'Noto Sans Gurmukhi', sans-serif"],
  ["Kocham cię", "Arial, sans-serif"]
];
const colors = ["#ff8bb8", "#ffb5d0", "#ff4f91", "#ffd0e1", "#e86aa4", "#ff9fbd"];
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");
let W = 800, H = 650, frame = 0, running = true, raf;
let completed = false;
const outlinePoints = 520;
const fillPoints = 1250;
const drawDuration = 560;   // outline drawing frames
const fillDuration = 680;   // interior fill frames
const totalDuration = drawDuration + fillDuration;
let layout = [];

function resize() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(300, rect.width); H = Math.max(300, rect.height);
  canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  layout = makeLayout();
  renderFrame();
}
function heartPoint(a) {
  return {
    x: 16 * Math.pow(Math.sin(a), 3),
    y: 13 * Math.cos(a) - 5 * Math.cos(2*a) - 2 * Math.cos(3*a) - Math.cos(4*a)
  };
}
function textAt(text, font, x, y, size, color, glow=false, alpha=1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.font = `700 ${size}px ${font}`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  if (glow) { ctx.shadowColor = color; ctx.shadowBlur = 10; }
  ctx.fillText(text, x, y);
  ctx.restore();
}
function heartInside(x, y) {
  // Normalized implicit check using the classic heart curve, robustly sample the outline.
  const poly = [];
  for (let i=0; i<360; i++) {
    const p=heartPoint(i*Math.PI/180);
    poly.push([p.x,p.y]);
  }
  let inside=false;
  for (let i=0,j=poly.length-1;i<poly.length;j=i++) {
    const [xi,yi]=poly[i], [xj,yj]=poly[j];
    const intersect=((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi+1e-9)+xi);
    if(intersect) inside=!inside;
  }
  return inside;
}
function makeLayout() {
  const scale = Math.min(W / 37, H / 33) * 0.94;
  const cx=W/2, cy=H/2+scale*0.1;
  const outline=[];
  for(let i=0;i<outlinePoints;i++){
    const a=2*Math.PI*i/outlinePoints;
    const p=heartPoint(a);
    outline.push({x:cx+p.x*scale,y:cy-p.y*scale, lang:i%phrases.length, color:colors[i%colors.length], glow:(i*13)%17===0});
  }
  // Deterministic rows of points inside the true heart polygon; avoid the outside/concave lobes.
  const inner=[];
  const minX=-15.3, maxX=15.3, minY=-16.0, maxY=12.0;
  const spacing=0.85;
  for(let y=minY;y<=maxY;y+=spacing){
    for(let x=minX;x<=maxX;x+=spacing){
      if(heartInside(x,y) && Math.sin(x*1.9+y*2.7)>-0.98){
        const p={x:cx+x*scale/16,y:cy-y*scale/16};
        const seed=Math.abs(Math.floor((x+20)*127+(y+20)*311));
        inner.push({x:p.x,y:p.y,lang:seed%phrases.length,color:colors[seed%colors.length],glow:seed%19===0});
      }
    }
  }
  // Draw from outer rows toward the middle to make the filling read as a deliberate fill.
  inner.sort((a,b)=>Math.abs(a.y-cy)-Math.abs(b.y-cy));
  return {scale,cx,cy,outline,inner};
}
function drawOutline(progress) {
  const count=Math.floor(progress*layout.outline.length);
  for(let i=0;i<count;i++){
    const p=layout.outline[i];
    const item=phrases[p.lang];
    const size=Math.max(6.5,Math.min(10,W/70));
    if(i%2===0) textAt(item[0],item[1],p.x,p.y,size,p.color,p.glow,0.98);
  }
  if(progress<1 && count>0){
    const p=layout.outline[Math.min(count-1,layout.outline.length-1)];
    ctx.save();ctx.fillStyle="#fff2f8";ctx.shadowColor="#ff4f91";ctx.shadowBlur=18;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.restore();
  }
}
function drawFill(progress) {
  const count=Math.floor(progress*layout.inner.length);
  for(let i=0;i<count;i++){
    const p=layout.inner[i], item=phrases[p.lang];
    const size=Math.max(6,Math.min(9,W/78));
    textAt(item[0],item[1],p.x,p.y,size,p.color,p.glow,0.9);
  }
}
function renderFrame() {
  if(!layout || !layout.outline) return;
  ctx.clearRect(0,0,W,H);
  const {scale,cx,cy}=layout;
  // A subtle heart-shaped glow, using the actual classic heart contour.
  ctx.save();ctx.globalAlpha=0.07;ctx.fillStyle="#ff247f";ctx.shadowColor="#ff247f";ctx.shadowBlur=45;
  ctx.beginPath();
  for(let i=0;i<=360;i++){
    const p=heartPoint(i*Math.PI/180), x=cx+p.x*scale, y=cy-p.y*scale;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.closePath();ctx.fill();ctx.restore();

  const outlineProgress=Math.min(1,frame/drawDuration);
  const fillProgress=Math.min(1,Math.max(0,(frame-drawDuration)/fillDuration));
  drawOutline(outlineProgress);
  if(frame>=drawDuration) drawFill(fillProgress);
  if(fillProgress>=1){
    // Center message remains visible forever after the animation completes.
    textAt("I love you, Divya","Arial, sans-serif",cx,cy,
      Math.max(13,Math.min(20,W/34)),"#fff0f7",true,1);
    completed=true;
  }
}
function animate() {
  if(!running) return;
  if(!completed) {
    frame++;
    renderFrame();
    if(frame>=totalDuration) { frame=totalDuration; renderFrame(); completed=true; }
    raf=requestAnimationFrame(animate);
  }
}
window.addEventListener("resize",resize);
document.getElementById("toggle").addEventListener("click",e=>{
  running=!running;
  e.currentTarget.textContent=running?"Pause animation":"Resume animation";
  if(running && !completed) animate();
  else cancelAnimationFrame(raf);
});
document.getElementById("share").addEventListener("click",async()=>{
  const data={title:document.title,text:"20 languages. One heart. ❤️",url:location.href};
  try{
    if(navigator.share) await navigator.share(data);
    else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);alert("Link copied!");}
    else prompt("Copy this link:",location.href);
  }catch(_){}
});
resize();
animate();
</script>
</body>
</html>
