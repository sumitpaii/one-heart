<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09020b">
<title>20 Languages, One Heart ❤️</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&family=Noto+Sans+Bengali:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+Thai:wght@400;700&family=Noto+Sans+Telugu:wght@400;700&family=Noto+Sans+Gurmukhi:wght@400;700&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #09020b; color: #ffe7f1; }
  body { font-family: system-ui, sans-serif; overflow: hidden; }
  main { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px 12px 24px; }
  h1 { font-size: clamp(1.15rem, 4vw, 1.8rem); margin: 0 0 5px; text-align: center; letter-spacing: .04em; font-weight: 600; }
  p { color: #d7a7bd; margin: 0 0 8px; font-size: .88rem; text-align: center; }
  canvas { display: block; width: min(96vw, 760px); height: min(74svh, 650px); max-height: 650px; }
  .bottom { display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; margin-top: 4px; }
  button { color: #ffe7f1; background: #28101f; border: 1px solid #a83b70; border-radius: 999px; padding: 10px 16px; font-size: .9rem; cursor: pointer; }
  button:hover { background:#40162f; }
  .note { font-size: .72rem; color:#98788a; margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1>19 Languages. One Heart. ❤️</h1>
  <p>Watch one message draw a heart, then fill it with love in 19 languages.</p>
  <canvas id="heart" aria-label="An animated heart made of love messages in 20 languages"></canvas>
  <div class="bottom">
    <button id="toggle">Pause animation</button>
    <button id="share">Share this page</button>
  </div>
  <div class="note">Made with love • Turn your phone sideways for a wider heart</div>
</main>
<script>
const phrases = [
  ["I love you, Divya", "Arial, sans-serif"],
  ["मैं तुमसे प्यार करता हूँ", "'Noto Sans Devanagari', sans-serif"],
  ["Je t’aime", "Arial, sans-serif"],
  ["Te amo", "Arial, sans-serif"],
  ["Anh yêu em", "Arial, sans-serif"],
  ["我爱你", "'Noto Sans JP', sans-serif"],
  ["愛してる", "'Noto Sans JP', sans-serif"],
  ["Я тебя люблю", "Arial, sans-serif"],
  ["사랑해", "'Noto Sans KR', sans-serif"],
  ["Ich liebe dich", "Arial, sans-serif"],
  ["Ti amo", "Arial, sans-serif"],
  ["Eu te amo", "Arial, sans-serif"],
  ["আমি তোমাকে ভালোবাসি", "'Noto Sans Bengali', sans-serif"],
  ["मी तुझ्यावर प्रेम करतो", "'Noto Sans Devanagari', sans-serif"],
  ["Seni seviyorum", "Arial, sans-serif"],
  ["Aku cinta kamu", "Arial, sans-serif"],
  ["ฉันรักคุณ", "'Noto Sans Thai', sans-serif"],
  ["నేను నిన్ను ప్రేమిస్తున్నాను", "'Noto Sans Telugu', sans-serif"],
  ["ਮੈਂ ਤੈਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹਾਂ", "'Noto Sans Gurmukhi', sans-serif"]
];
const colors = ["#ff8bb8", "#ffb5d0", "#ff4f91", "#ffd0e1", "#e86aa4", "#ff9fbd"];
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");
let W = 800, H = 650, frame = 0, running = true, raf;
const outlinePoints = 620;
const fillPoints = 1600;
const cycleFrames = 1200; // ~20 seconds at 60fps

function resize() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.max(300, rect.width); H = Math.max(300, rect.height);
  canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function heartPoint(a) {
  return {
    x: 16 * Math.pow(Math.sin(a), 3),
    y: 13 * Math.cos(a) - 5 * Math.cos(2*a) - 2 * Math.cos(3*a) - Math.cos(4*a)
  };
}
function pos(a, shrink, scale, cx, cy) {
  const p = heartPoint(a);
  return {x: cx + p.x * scale * shrink, y: cy - p.y * scale * shrink};
}
function textAt(text, font, x, y, size, color, alpha=1) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 7;
  ctx.font = `700 ${size}px ${font}`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, x, y);
  ctx.restore();
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  const scale = Math.min(W / 37, H / 33) * 0.94;
  const cx = W / 2, cy = H / 2 + scale * 0.12;
  const phase = (frame % cycleFrames) / cycleFrames;
  const outlinePhase = 0.57; // first 57% draws the outline
  const outlineProgress = Math.min(1, phase / outlinePhase);
  const fillProgress = Math.max(0, (phase - outlinePhase) / (1 - outlinePhase));

  // Gentle glow
  ctx.save();
  ctx.globalAlpha = 0.07;
  ctx.fillStyle = "#ff247f";
  ctx.shadowColor = "#ff247f";
  ctx.shadowBlur = 48;
  ctx.beginPath();
  for (let i=0; i<=360; i++) {
    const p = pos(i*Math.PI/180, 1, scale, cx, cy);
    if (!i) ctx.moveTo(p.x,p.y); else ctx.lineTo(p.x,p.y);
  }
  ctx.closePath(); ctx.fill(); ctx.restore();

  // PHASE 1: one phrase writes the outline like handwriting.
  // As the line grows, the phrase changes language along the path.
  const visibleOutline = Math.floor(outlineProgress * outlinePoints);
  for (let i=0; i<visibleOutline; i++) {
    const a = (i / outlinePoints) * Math.PI * 2;
    const p = pos(a, 1, scale, cx, cy);
    const langIndex = Math.min(phrases.length - 1, Math.floor(i / outlinePoints * phrases.length));
    const phrase = phrases[langIndex];
    const size = Math.max(7, Math.min(11, W / 64));
    // Draw the first few characters as a writing trail, then full phrase at intervals.
    const reveal = Math.floor((frame * 0.9) % Math.max(1, phrase[0].length));
    const shown = i < 10 ? "I love you, Divya".slice(0, Math.max(1, reveal)) : phrase[0];
    if (i % 3 === 0) textAt(shown, phrase[1], p.x, p.y, size, colors[i % colors.length], 0.96);
  }

  // A tiny glowing cursor travels along the line as if it is being drawn.
  if (outlineProgress < 1) {
    const p = pos(outlineProgress * Math.PI * 2, 1, scale, cx, cy);
    ctx.save(); ctx.fillStyle="#fff0f7"; ctx.shadowColor="#ff4f91"; ctx.shadowBlur=18;
    ctx.beginPath(); ctx.arc(p.x,p.y,3.2,0,Math.PI*2); ctx.fill(); ctx.restore();
  }

  // PHASE 2: once the outline is complete, fill it from the outside inward with multilingual text.
  if (fillProgress > 0) {
    const maxFill = Math.floor(fillProgress * fillPoints);
    for (let i=0; i<maxFill; i++) {
      const layer = Math.floor(i / 180);
      const within = (i % 180) / 180;
      const a = within * Math.PI * 2 + layer * 0.11;
      const shrink = Math.max(0.08, 0.92 - layer * 0.095);
      const p = pos(a, shrink, scale, cx, cy);
      const item = phrases[(i * 7 + layer * 3 + Math.floor(frame / 20)) % phrases.length];
      const size = Math.max(6, Math.min(10, W / 72));
      if (i % 2 === 0) textAt(item[0], item[1], p.x, p.y, size, colors[(i+layer)%colors.length], 0.88);
    }
  }

  // Personal message appears only after the heart is filled.
  if (fillProgress > 0.94) {
    const alpha = Math.min(1, (fillProgress - 0.94) / 0.06);
    textAt("I love you, Divya", "Arial, sans-serif", cx, cy + scale*0.03,
      Math.max(13, Math.min(20, W/34)), "#fff0f7", alpha);
  }
  frame++;
  if (running) raf = requestAnimationFrame(draw);
}
window.addEventListener("resize", () => { resize(); });
document.getElementById("toggle").addEventListener("click", e => {
  running = !running;
  e.currentTarget.textContent = running ? "Pause animation" : "Resume animation";
  if (running) draw(); else cancelAnimationFrame(raf);
});
document.getElementById("share").addEventListener("click", async () => {
  const data = { title: document.title, text: "19 languages. One heart. ❤️", url: location.href };
  try {
    if (navigator.share) await navigator.share(data);
    else if (navigator.clipboard) { await navigator.clipboard.writeText(location.href); alert("Link copied!"); }
    else prompt("Copy this link:", location.href);
  } catch (_) {}
});
resize(); draw();
</script>
</body>
</html>
