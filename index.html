<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#09020b">
<title>My Heart for You</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700&family=Noto+Sans+Bengali:wght@400;700&family=Noto+Sans+Devanagari:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+KR:wght@400;700&family=Noto+Sans+Thai:wght@400;700&family=Noto+Sans+Telugu:wght@400;700&family=Noto+Sans+Gurmukhi:wght@400;700&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #09020b; color: #ffe7f1; }
  body { font-family: system-ui, sans-serif; overflow: hidden; }
  main { min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px 12px 24px; }
  h1 { font-size: clamp(1.15rem, 4vw, 1.8rem); margin: 0 0 5px; text-align: center; letter-spacing: .04em; font-weight: 600; }
  p { color: #d7a7bd; margin: 0 0 8px; font-size: .88rem; text-align: center; }
  canvas { display: block; width: min(96vw, 760px); height: min(74svh, 650px); max-height: 650px; }
  .bottom { display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; margin-top: 4px; }
  button { color: #ffe7f1; background: #28101f; border: 1px solid #a83b70; border-radius: 999px; padding: 10px 16px; font-size: .9rem; cursor: pointer; }
  button:hover { background:#40162f; }
  .note { font-size: .72rem; color:#98788a; margin-top:8px; }
</style>
</head>
<body>
<main>
  <h1>My Heart for You</h1>
  <p>Watch a heart draw itself with love in 20 languages.</p>
  <canvas id="heart" aria-label="An animated heart made of love messages in 20 languages"></canvas>
  <div class="bottom">
    <button id="toggle">Pause animation</button>
    <button id="share">Share this page</button>
  </div>
  <div class="note">Made for you, Darling • Turn your phone sideways for a wider heart</div>
</main>
<script>
const phrases = [
  ["I love you, Divya", "Arial, sans-serif"],
  ["मैं तुमसे प्यार करता हूँ", "'Noto Sans Devanagari', sans-serif"],
  ["Je t’aime", "Arial, sans-serif"],
  ["Te amo", "Arial, sans-serif"],
  ["Anh yêu em", "Arial, sans-serif"],
  ["我爱你", "'Noto Sans JP', sans-serif"],
  ["愛してる", "'Noto Sans JP', sans-serif"],
  ["Я тебя люблю", "Arial, sans-serif"],
  ["사랑해", "'Noto Sans KR', sans-serif"],
  ["Ich liebe dich", "Arial, sans-serif"],
  ["Ti amo", "Arial, sans-serif"],
  ["Eu te amo", "Arial, sans-serif"],
  ["আমি তোমাকে ভালোবাসি", "'Noto Sans Bengali', sans-serif"],
  ["मी तुझ्यावर प्रेम करतो", "'Noto Sans Devanagari', sans-serif"],
  ["Seni seviyorum", "Arial, sans-serif"],
  ["Aku cinta kamu", "Arial, sans-serif"],
  ["ฉันรักคุณ", "'Noto Sans Thai', sans-serif"],
  ["నేను నిన్ను ప్రేమిస్తున్నాను", "'Noto Sans Telugu', sans-serif"],
  ["ਮੈਂ ਤੈਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹਾਂ", "'Noto Sans Gurmukhi', sans-serif"],
  ["Kocham cię", "Arial, sans-serif"]
];
const colors = ["#ff8bb8", "#ffb5d0", "#ff4f91", "#ffd0e1", "#e86aa4", "#ff9fbd"];
const canvas = document.getElementById("heart");
const ctx = canvas.getContext("2d");
let W=800,H=650,running=true,raf=null,complete=false,items=[],cursor=0;
const canvasFontSize = () => Math.max(6, Math.min(8.5, W/85));

function heartPoint(t) {
  return {
    x: 16*Math.pow(Math.sin(t),3),
    y: 13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)
  };
}
function resize() {
  const rect=canvas.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2);
  W=Math.max(300,rect.width); H=Math.max(300,rect.height);
  canvas.width=Math.floor(W*dpr); canvas.height=Math.floor(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  buildItems();
  cursor=0; complete=false; running=true;
  drawBackground();
  animate();
}
function drawBackground() {
  ctx.clearRect(0,0,W,H);
  const scale=Math.min(W/37,H/33)*0.92,cx=W/2,cy=H/2+scale*0.05;
  ctx.save();ctx.globalAlpha=.055;ctx.fillStyle="#ff247f";ctx.shadowColor="#ff247f";ctx.shadowBlur=45;
  ctx.beginPath();
  for(let i=0;i<=360;i++){
    const p=heartPoint(i*Math.PI/180),x=cx+p.x*scale,y=cy-p.y*scale;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.closePath();ctx.fill();ctx.restore();
}
function buildItems() {
  items=[];
  const scale=Math.min(W/37,H/33)*0.92,cx=W/2,cy=H/2+scale*0.05;
  const outlineCount=560;
  // First, trace the outer boundary in order, like drawing with a pen.
  for(let i=0;i<outlineCount;i++){
    const t=2*Math.PI*i/outlineCount,p=heartPoint(t);
    items.push({x:cx+p.x*scale,y:cy-p.y*scale,lang:i%phrases.length,
      color:colors[i%colors.length],glow:(i%43===9)||(i%71===18),phase:0});
  }
  // Then draw nested contours from the outer edge inward. Nested heart outlines
  // fill the whole silhouette reliably, unlike a sparse border-only layout.
  const layers=34, pointsPerLayer=250;
  for(let layer=0;layer<layers;layer++){
    const shrink=0.96-layer*(0.91/(layers-1));
    for(let i=0;i<pointsPerLayer;i++){
      const t=2*Math.PI*i/pointsPerLayer+(layer%2)*0.012,p=heartPoint(t);
      const seed=layer*pointsPerLayer+i;
      items.push({
        x:cx+p.x*scale*shrink,y:cy-p.y*scale*shrink,
        lang:(seed*7+layer)%phrases.length,
        color:colors[(seed*3+layer)%colors.length],
        // Sparse random-looking twinkles, not every phrase glowing.
        glow:(seed%37===5)||(seed%83===17)||(seed%127===31),
        phase:1
      });
    }
  }
  // Scatter a few extra text points between the rings to make the heart look full.
  // A ring-based fill keeps the heart silhouette clean and dense.
}
function paint(item) {
  const phrase=phrases[item.lang], size=canvasFontSize();
  ctx.save();
  ctx.font=`700 ${size}px ${phrase[1]}`;
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.fillStyle=item.color;
  ctx.globalAlpha=item.phase===0?0.98:0.86;
  if(item.glow){ctx.shadowColor=item.color;ctx.shadowBlur=11;}
  ctx.fillText(phrase[0],item.x,item.y);
  ctx.restore();
}
function paintCenter() {
  const scale=Math.min(W/37,H/33)*0.92,cx=W/2,cy=H/2+scale*0.05;
  ctx.save();ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.font=`700 ${Math.max(12,Math.min(18,W/36))}px Arial,sans-serif`;
  ctx.fillStyle="#fff4fa";ctx.shadowColor="#ff69a8";ctx.shadowBlur=13;
  ctx.fillText("I love you, Divya",cx,cy);
  ctx.restore();
}
function animate() {
  if(!running||complete)return;
  // Add a batch each frame; previously drawn text stays on canvas permanently.
  const batch=42;
  const end=Math.min(items.length,cursor+batch);
  for(;cursor<end;cursor++)paint(items[cursor]);
  // Small pen sparkle during the outline phase.
  if(cursor<560 && cursor>0){
    const p=items[cursor-1];
    ctx.save();ctx.fillStyle="#fff7fb";ctx.shadowColor="#ff4f91";ctx.shadowBlur=15;
    ctx.beginPath();ctx.arc(p.x,p.y,2.4,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  if(cursor>=items.length){
    paintCenter();
    complete=true;
    document.getElementById("toggle").textContent="Replay animation";
    return;
  }
  raf=requestAnimationFrame(animate);
}
function startAnimation(rebuild=false) {
  if(raf)cancelAnimationFrame(raf);
  running=true;complete=false;cursor=0;
  if(rebuild){drawBackground();buildItems();}
  document.getElementById("toggle").textContent="Pause animation";
  animate();
}
window.addEventListener("resize",()=>{if(raf)cancelAnimationFrame(raf);resize();});
document.getElementById("toggle").addEventListener("click",e=>{
  if(complete){startAnimation(true);return;}
  running=!running;
  e.currentTarget.textContent=running?"Pause animation":"Resume animation";
  if(running)animate();else if(raf)cancelAnimationFrame(raf);
});
document.getElementById("share").addEventListener("click",async()=>{
  const data={title:document.title,text:"20 languages. One heart. ❤️",url:location.href};
  try{if(navigator.share)await navigator.share(data);else if(navigator.clipboard){await navigator.clipboard.writeText(location.href);alert("Link copied!");}else prompt("Copy this link:",location.href);}catch(_){}
});
resize();
</script>
</body>
</html>
